<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002DB3"/>
      <stop offset="50%" stop-color="#0040FF"/>
      <stop offset="100%" stop-color="#002699"/>
    </linearGradient>
    <linearGradient id="goldGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="40%" stop-color="#FFBE00"/>
      <stop offset="100%" stop-color="#E69900"/>
    </linearGradient>
    <linearGradient id="goldGradSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB66"/>
      <stop offset="50%" stop-color="#FFC400"/>
      <stop offset="100%" stop-color="#E69500"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="280" cy="220" r="140" fill="#FFC000" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Group with Rotation to match official Kinbex angle -->
  <g transform="translate(250, 250) rotate(-42) translate(-250, -250)">
    
    <!-- Primary Dumbbell Node (Large) -->
    <path d="
      M 200,100
      A 75,75 0 0,1 200,250
      C 200,285 170,305 170,335
      A 95,95 0 0,1 30,335
      A 95,95 0 0,1 170,335
      C 170,305 200,285 200,250
      Z" 
      fill="none" />
      
    <!-- Accurate Organic Double-Bulb 1 (Major) -->
    <path d="
      M 250,110 
      C 300,110 330,150 330,195 
      C 330,230 305,255 290,280 
      C 275,305 285,325 305,355
      C 325,385 315,430 270,445
      C 225,460 180,430 170,385
      C 160,345 180,310 200,285
      C 220,260 215,230 200,200
      C 180,160 205,110 250,110 Z" 
      fill="url(#goldGradMain)" 
      filter="url(#softGlow)" />

    <!-- Organic Double-Bulb 2 (Parallel Minor Satellite) -->
    <path d="
      M 370,270 
      C 395,270 415,290 415,315 
      C 415,335 400,350 390,365 
      C 380,380 385,395 395,410
      C 408,425 400,450 375,458
      C 350,465 325,448 320,425
      C 315,405 325,385 335,370
      C 345,355 342,338 335,322
      C 325,300 340,270 370,270 Z" 
      fill="url(#goldGradSec)" />
  </g>
</svg>
