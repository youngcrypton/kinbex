<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A18"/>
      <stop offset="50%" stop-color="#07122A"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFB800" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0035A8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- KIN: Kinetic Energy Gradient (Electric Cobalt to Cyan) -->
    <linearGradient id="kinEnergyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#002D9C"/>
    </linearGradient>

    <!-- BEX: Community Gradient (Radiant Gold to Warm Amber) -->
    <linearGradient id="bexCommunityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="45%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#E07A00"/>
    </linearGradient>

    <!-- Specular Highlight Gradients -->
    <linearGradient id="highlightBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="highlightGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="102" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Radial Core Ambient Lights -->
  <circle cx="210" cy="230" r="140" fill="#0052FF" opacity="0.18" filter="url(#coreGlow)"/>
  <circle cx="310" cy="285" r="130" fill="#FFB800" opacity="0.16" filter="url(#coreGlow)"/>

  <!-- KINBEX Interconnected Mark: Two kinetic forms converging as one -->
  <g transform="translate(0, 0)">
    
    <!-- Shadow / Ambient Depth for Convergence -->
    <path d="M 180,130 C 230,130 270,165 295,215 C 315,255 345,285 390,285 C 415,285 435,275 445,260 C 435,320 380,365 320,365 C 270,365 230,330 205,280 C 185,240 155,210 110,210 C 85,210 65,220 55,235 C 65,175 120,130 180,130 Z" 
          fill="#000000" opacity="0.35" filter="url(#coreGlow)"/>

    <!-- FORM 1 (KIN - Kinetic Momentum): Flowing primary ribbon loop from upper-left to center crossover -->
    <path d="M 160,140 C 225,140 272,185 295,235 C 315,278 348,310 395,310 C 428,310 448,295 455,275 C 445,340 388,375 330,375 C 265,375 220,330 198,285 C 178,242 142,205 95,205 C 65,205 48,218 38,235 C 48,172 105,140 160,140 Z" 
          fill="url(#kinEnergyGrad)"/>

    <!-- KIN Upper Crest Highlight -->
    <path d="M 160,140 C 215,140 258,178 282,222 C 265,185 220,152 165,152 C 118,152 72,178 52,225 C 60,175 110,140 160,140 Z" 
          fill="url(#highlightBlue)"/>

    <!-- FORM 2 (BEX - Community): Intersecting radiant gold arc linking people & momentum into the unified kinetic knot -->
    <path d="M 352,140 C 408,140 455,182 458,238 C 445,222 425,210 395,210 C 352,210 322,242 300,285 C 280,325 245,360 190,360 C 145,360 108,335 90,295 C 105,308 128,315 152,315 C 198,315 228,285 250,242 C 272,198 305,140 352,140 Z" 
          fill="url(#bexCommunityGrad)"/>

    <!-- BEX Upper Crest Highlight -->
    <path d="M 352,140 C 395,140 435,170 450,210 C 438,180 400,152 355,152 C 315,152 285,195 265,235 C 282,190 315,140 352,140 Z" 
          fill="url(#highlightGold)"/>

    <!-- Central Kinetic Convergence Node (Pulse Core) -->
    <ellipse cx="274" cy="256" rx="22" ry="34" transform="rotate(-28 274 256)" fill="#FFFFFF" opacity="0.9" filter="url(#coreGlow)"/>
    <ellipse cx="274" cy="256" rx="10" ry="18" transform="rotate(-28 274 256)" fill="#FFFFFF"/>
  </g>
</svg>
