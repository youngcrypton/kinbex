<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" style="background:#060B18; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="payGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#0047FF"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="pCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B38"/>
      <stop offset="100%" stop-color="#081021"/>
    </linearGradient>
  </defs>

  <text x="500" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900" letter-spacing="1">KIN PAY: NIGERIA &amp; AFRICAN FIAT-TO-CRYPTO CLEARINGHOUSE</text>
  <text x="500" y="65" text-anchor="middle" fill="#94a3b8" font-size="12">Direct Multi-Asset Off-Ramp to Nigerian Naira (NGN) with Sub-30s Automated Bank Settlement</text>

  <!-- Step 1: User / Trader -->
  <rect x="50" y="110" width="200" height="190" rx="12" fill="url(#pCard)" stroke="#0047FF" stroke-width="2"/>
  <text x="150" y="150" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">User / Trader</text>
  <text x="150" y="180" text-anchor="middle" fill="#ffffff" font-size="12">Kinbex Non-Custodial</text>
  <text x="150" y="200" text-anchor="middle" fill="#ffffff" font-size="12">Multi-Chain Wallet</text>
  <text x="150" y="235" text-anchor="middle" fill="#FFB800" font-size="11" font-weight="bold">USDT • USDC • ETH</text>
  <text x="150" y="255" text-anchor="middle" fill="#FFB800" font-size="11" font-weight="bold">SOL • BNB • $KINBEX</text>

  <!-- Arrow 1 -->
  <path d="M 250 205 L 340 205" stroke="#10b981" stroke-width="3"/>
  <text x="295" y="190" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold">Ramp-Out / Swap</text>

  <!-- Step 2: Kin Pay Liquidity Engine -->
  <rect x="350" y="100" width="260" height="210" rx="12" fill="url(#pCard)" stroke="url(#payGrad)" stroke-width="2.5"/>
  <text x="480" y="140" text-anchor="middle" fill="#FFB800" font-size="17" font-weight="bold">KIN PAY ENGINE</text>
  <text x="480" y="165" text-anchor="middle" fill="#cbd5e1" font-size="12">Automated Rate Aggregator</text>
  <text x="480" y="195" text-anchor="middle" fill="#94a3b8" font-size="11">• Real-Time NGN FX Oracles</text>
  <text x="480" y="215" text-anchor="middle" fill="#94a3b8" font-size="11">• Deep Institutional Liquidity</text>
  <text x="480" y="235" text-anchor="middle" fill="#94a3b8" font-size="11">• Zero Fraud Escrow Proof</text>
  <text x="480" y="270" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">Avg Settlement &lt; 30s</text>

  <!-- Arrow 2 -->
  <path d="M 610 205 L 700 205" stroke="#0047FF" stroke-width="3"/>
  <text x="655" y="190" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">Direct NIBSS / NGN</text>

  <!-- Step 3: Destination Banking -->
  <rect x="710" y="110" width="250" height="190" rx="12" fill="url(#pCard)" stroke="#0047FF" stroke-width="2"/>
  <text x="835" y="150" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">Local Bank &amp; Spend</text>
  <text x="835" y="180" text-anchor="middle" fill="#ffffff" font-size="12">Nigerian Commercial Banks</text>
  <text x="835" y="200" text-anchor="middle" fill="#94a3b8" font-size="11">(GTB, Access, Zenith, Kuda, OPay)</text>
  <text x="835" y="235" text-anchor="middle" fill="#FFB800" font-size="12" font-weight="bold">+ Kinbex Virtual Cards</text>
  <text x="835" y="255" text-anchor="middle" fill="#94a3b8" font-size="11">(Global Online Spending)</text>

  <!-- Bottom note -->
  <text x="500" y="345" text-anchor="middle" fill="#94a3b8" font-size="12">Dual-Channel: Also supports Ramp-In (buying crypto &amp; stablecoins directly with local fiat bank transfers)</text>
</svg>
