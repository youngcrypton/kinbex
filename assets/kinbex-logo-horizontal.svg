<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040816"/>
      <stop offset="50%" stop-color="#071126"/>
      <stop offset="100%" stop-color="#030612"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFB800" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Kinetic Blue Gradient -->
    <linearGradient id="hKinBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#00298A"/>
    </linearGradient>

    <!-- Community Gold Gradient -->
    <linearGradient id="hBexGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF37A"/>
      <stop offset="45%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0052FF" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="1200" height="320" rx="24" fill="url(#bannerBg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#techGrid)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="22.5" fill="none" stroke="url(#bannerBorder)" stroke-width="2"/>

  <!-- Ambient Glow Spots -->
  <circle cx="160" cy="160" r="140" fill="#0052FF" opacity="0.22" filter="url(#hGlow)"/>
  <circle cx="240" cy="180" r="120" fill="#FFB800" opacity="0.14" filter="url(#hGlow)"/>
  <circle cx="1050" cy="80" r="160" fill="#0052FF" opacity="0.08" filter="url(#hGlow)"/>

  <!-- Left Logo Container -->
  <g transform="translate(60, 48)">
    <rect width="224" height="224" rx="48" fill="#060C1F" stroke="#1E293B" stroke-width="2"/>
    <rect x="2" y="2" width="220" height="220" rx="46" fill="none" stroke="url(#bannerBorder)" stroke-width="1.5"/>

    <!-- Scaled Vector Symbol (Two Interconnected Kinetic Forms) -->
    <g transform="translate(112, 112) scale(0.36) translate(-256, -256)">
      <!-- KIN Form -->
      <path d="M 160,140 C 225,140 272,185 295,235 C 315,278 348,310 395,310 C 428,310 448,295 455,275 C 445,340 388,375 330,375 C 265,375 220,330 198,285 C 178,242 142,205 95,205 C 65,205 48,218 38,235 C 48,172 105,140 160,140 Z" 
            fill="url(#hKinBlue)"/>
      <!-- BEX Form -->
      <path d="M 352,140 C 408,140 455,182 458,238 C 445,222 425,210 395,210 C 352,210 322,242 300,285 C 280,325 245,360 190,360 C 145,360 108,335 90,295 C 105,308 128,315 152,315 C 198,315 228,285 250,242 C 272,198 305,140 352,140 Z" 
            fill="url(#hBexGold)"/>
      <!-- Center Convergence Pulse -->
      <ellipse cx="274" cy="256" rx="24" ry="36" transform="rotate(-28 274 256)" fill="#FFFFFF" opacity="0.9" filter="url(#hGlow)"/>
    </g>
  </g>

  <!-- Typography & Brand Info -->
  <g transform="translate(325, 60)">
    <!-- Protocol Badge -->
    <g transform="translate(0, 0)">
      <rect width="180" height="28" rx="6" fill="#0052FF" fill-opacity="0.15" stroke="#0052FF" stroke-width="1.2"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="2">KINBEX PROTOCOL</text>
      <text x="135" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFB800">v3.0.0</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="4">KINBEX</text>
    <text x="245" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="20" font-weight="800" fill="#FFB800" letter-spacing="3">SUPER-TERMINAL</text>

    <!-- Subtitle -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="15" font-weight="600" fill="#94A3B8" letter-spacing="1.2">THE UNIFIED WEB3 SOCIAL TERMINAL &amp; DECENTRALIZED FINANCIAL RAILS</text>

    <!-- Horizontal Divider -->
    <line x1="0" y1="142" x2="800" y2="142" stroke="#1E293B" stroke-width="1.2"/>

    <!-- Pillar Badges -->
    <g transform="translate(0, 162)">
      <!-- Pill 1: Verified Alpha -->
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="8" fill="#0B1736" stroke="#0052FF" stroke-width="1.2"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8">✦ Verified Alpha Engine</text>
      </g>

      <!-- Pill 2: Kin Pay -->
      <g transform="translate(195, 0)">
        <rect width="180" height="32" rx="8" fill="#0B1736" stroke="#10B981" stroke-width="1.2"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#34D399">✦ Kin Pay NGN Clearing</text>
      </g>

      <!-- Pill 3: Kinara AI -->
      <g transform="translate(390, 0)">
        <rect width="170" height="32" rx="8" fill="#0B1736" stroke="#FFB800" stroke-width="1.2"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#FFB800">✦ Kinara AI Co-Pilot</text>
      </g>

      <!-- Pill 4: Kinbex Game -->
      <g transform="translate(575, 0)">
        <rect width="165" height="32" rx="8" fill="#0B1736" stroke="#A855F7" stroke-width="1.2"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#C084FC">✦ Web3 Game Studio</text>
      </g>
    </g>
  </g>
</svg>
